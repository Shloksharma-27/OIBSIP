<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OmniCalc Pro — Modern browser-based arithmetic calculator with operator chaining, CSS Grid layout, safe expression evaluation, and calculation history.">
  <title>OmniCalc Pro — Smart Arithmetic Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-wrapper">
    <!-- Calculator Container -->
    <main class="calc-card">
      
      <!-- Calculator Header -->
      <div class="calc-header">
        <div class="calc-branding">
          <span class="calc-badge">OMNICALC</span>
          <span class="calc-model">FX-2026</span>
        </div>
        <button class="history-toggle-btn" id="history-toggle" title="Toggle Calculation History" aria-label="Toggle History">
          🕒 History
        </button>
      </div>

      <!-- Display Screen -->
      <div class="calc-display" id="calc-display">
        <div class="display-history" id="display-history"></div>
        <div class="display-current" id="display-current">0</div>
      </div>

      <!-- Button Grid (Laid out with pure CSS Grid, No inline onclicks) -->
      <div class="calc-grid" id="calc-grid">
        <!-- Row 1 -->
        <button type="button" class="calc-btn btn-function" data-action="all-clear">AC</button>
        <button type="button" class="calc-btn btn-function" data-action="delete">DEL</button>
        <button type="button" class="calc-btn btn-function" data-action="percent">%</button>
        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="÷">÷</button>

        <!-- Row 2 -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="7">7</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="8">8</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="9">9</button>
        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="×">×</button>

        <!-- Row 3 -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="4">4</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="5">5</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="6">6</button>
        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="-">-</button>

        <!-- Row 4 -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="1">1</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="2">2</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="3">3</button>
        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="+">+</button>

        <!-- Row 5 -->
        <button type="button" class="calc-btn btn-function" data-action="negate">±</button>
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="0">0</button>
        <button type="button" class="calc-btn btn-number" data-action="decimal" data-value=".">.</button>
        <button type="button" class="calc-btn btn-equals" data-action="calculate">=</button>
      </div>

      <!-- Calculation History Drawer -->
      <div class="history-drawer" id="history-drawer">
        <div class="history-header">
          <span>Recent Computations</span>
          <button class="clear-history-btn" id="clear-history">Clear</button>
        </div>
        <div class="history-list" id="history-list">
          <div class="empty-history">No computations recorded yet.</div>
        </div>
      </div>

      <div class="keyboard-hint">
        <span>⌨️ Full keyboard input enabled (Numbers, +, -, *, /, Enter, Backspace, Esc)</span>
      </div>
    </main>

    <footer class="calc-footer">
      <p>Oasis Infobyte SIP — Web Development & Designing (Level 2, Task 1)</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
